    <rect x="369" y="72" width="12" height="12" rx="1" opacity="0.9"/>
    <rect x="402" y="72" width="12" height="12" rx="1"/>
    <rect x="435" y="72" width="12" height="12" rx="1" opacity="0.65"/>
