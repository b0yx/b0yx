<svg width="1000" height="170" viewBox="0 0 1000 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Contribution flow</title>
  <desc id="desc">A clean contribution flow panel representing workflow automation, backend systems, and ERP modules.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C12"/>
      <stop offset="0.48" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="168" fill="url(#panel)" stroke="#21262D" stroke-width="1.5"/>
  <path d="M42 44H205" stroke="#2490EF" stroke-width="4" filter="url(#glow)"/>
